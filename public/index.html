<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Universal Website Connector</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>🔌 Universal Website Connector</h1>
    <div class="session-row">
      <label>Session <input id="sessionId" value="dashboard" spellcheck="false" /></label>
      <button id="closeSessionBtn" title="Close browser session">Close session</button>
    </div>
  </header>

  <main>
    <section class="preview-pane">
      <form id="navForm" class="url-bar">
        <input id="urlInput" type="text" placeholder="https://example.com" autocomplete="off" />
        <button type="submit">Go</button>
        <button type="button" id="refreshBtn" title="Refresh screenshot">⟳</button>
      </form>
      <div class="page-state" id="pageState">No page loaded yet.</div>
      <div class="screenshot-frame">
        <img id="screenshot" alt="Page screenshot will appear here" />
        <div id="screenshotPlaceholder" class="placeholder">Navigate to a URL to see a live screenshot here.</div>
      </div>
    </section>

    <section class="control-pane">
      <nav class="tabs" id="tabs">
        <button data-tab="fetch" class="active">Fetch</button>
        <button data-tab="edit">Edit</button>
        <button data-tab="click">Click / Fill</button>
        <button data-tab="js">Run JS</button>
        <button data-tab="login">Login</button>
      </nav>

      <div class="tab-panel" id="tab-fetch">
        <h2>Fetch content</h2>
        <label>CSS selector <input id="fetchSelector" placeholder="body (default)" /></label>
        <label>Mode
          <select id="fetchMode">
            <option value="text">text</option>
            <option value="innerHtml">innerHtml</option>
            <option value="outerHtml">outerHtml</option>
          </select>
        </label>
        <button id="fetchBtn">Fetch</button>
      </div>

      <div class="tab-panel hidden" id="tab-edit">
        <h2>Live-edit DOM</h2>
        <label>CSS selector <input id="editSelector" placeholder="h1" /></label>
        <label>New text <input id="editText" placeholder="leave blank to use HTML instead" /></label>
        <label>New HTML <textarea id="editHtml" rows="3" placeholder="leave blank to use text instead"></textarea></label>
        <label class="checkbox"><input type="checkbox" id="editAll" /> Apply to all matches</label>
        <button id="editBtn">Apply edit</button>
      </div>

      <div class="tab-panel hidden" id="tab-click">
        <h2>Click / Fill</h2>
        <label>Selector to click <input id="clickSelector" placeholder="button.submit" /></label>
        <button id="clickBtn">Click</button>
        <hr />
        <label>Selector to fill <input id="fillSelector" placeholder="input[name=q]" /></label>
        <label>Value <input id="fillValue" placeholder="text to type" /></label>
        <button id="fillBtn">Fill</button>
      </div>

      <div class="tab-panel hidden" id="tab-js">
        <h2>Run JavaScript in page</h2>
        <textarea id="jsScript" rows="6" placeholder="return document.title"></textarea>
        <button id="jsBtn">Run</button>
      </div>

      <div class="tab-panel hidden" id="tab-login">
        <h2>Login</h2>
        <label>Login URL (optional) <input id="loginUrl" placeholder="https://site.com/login" /></label>
        <label>Username selector <input id="loginUserSel" placeholder="#username" /></label>
        <label>Password selector <input id="loginPassSel" placeholder="#password" /></label>
        <label>Submit selector <input id="loginSubmitSel" placeholder="button[type=submit]" /></label>
        <label>Username <input id="loginUser" /></label>
        <label>Password <input id="loginPass" type="password" /></label>
        <button id="loginBtn">Log in</button>
      </div>

      <div class="output">
        <h3>Output</h3>
        <pre id="output">Ready.</pre>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
